name: Validate and publish release artifacts

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      distributions_artifact_id: ${{ steps.distributions.outputs.artifact-id }}
      container_artifact_id: ${{ steps.container.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "$(tr -d '\r\n' < brds/VERSION)"
      - name: Build the release image once
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: brds:release-test
      - name: Exercise the server and data readers
        run: python3 scripts/check_container.py brds:release-test
      - name: Extract the distributions installed in the tested image
        run: |
          container=$(docker create brds:release-test)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/opt/brds-dist" dist
      - name: Validate Python distributions
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-publish.lock
          python -m twine check --strict dist/*
          sha256sum dist/* > distributions.sha256
      - name: Save the tested image
        run: |
          docker image inspect --format '{{.Id}}' brds:release-test > image.id
          docker save brds:release-test | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.sha256
      - uses: actions/upload-artifact@v7.0.1
        id: distributions
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: |
            dist/
            distributions.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        id: container
        with:
          name: tested-container-${{ github.run_attempt }}
          path: |
            image.tar.gz
            image.id
            image.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Create Release
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Generate Changelog
        run: .github/release_message.sh > release_message.md
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release_message.md

  deploy:
    name: Publish tested Python distributions
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.distributions_artifact_id }}
      - name: Verify and publish saved distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          sha256sum --check distributions.sha256
          python -m pip install --require-hashes --only-binary=:all: -r requirements-publish.lock
          python -m twine upload dist/*

  build-and-push:
    name: Publish tested container after PyPI succeeds
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.container_artifact_id }}
      - name: Verify and load the saved image
        run: |
          sha256sum --check image.sha256
          docker load --input image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' brds:release-test)" = "$(cat image.id)"
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push the tested image
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/brds
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker tag brds:release-test "$IMAGE_REPOSITORY:$RELEASE_TAG"
          docker tag brds:release-test "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:$RELEASE_TAG"
          docker push "$IMAGE_REPOSITORY:latest"
